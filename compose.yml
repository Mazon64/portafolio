services:
  portfolio:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:?SITE_URL must be defined in .env.docker}
    environment:
      SITE_URL: ${SITE_URL:?SITE_URL must be defined in .env.docker}
      HOSTNAME: ${HOSTNAME:?HOSTNAME must be defined in .env.docker}
      PORT: ${PORT:?PORT must be defined in .env.docker}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be defined in .env.docker}
      CONTACT_DELIVERY_ENABLED: ${CONTACT_DELIVERY_ENABLED:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      CONTACT_FROM_EMAIL: ${CONTACT_FROM_EMAIL:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "${HOST_PORT:?HOST_PORT must be defined in .env.docker}:${PORT:?PORT must be defined in .env.docker}"
    restart: unless-stopped
