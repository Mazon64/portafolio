name: Delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        env:
          DIRECT_URL: postgresql://prisma:prisma@127.0.0.1:5432/postgres

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://davidaranda.dev' }}

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and publish image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: |
            SITE_URL=${{ vars.SITE_URL || 'https://davidaranda.dev' }}
            APP_VERSION=${{ github.sha }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'workflow_dispatch'
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate deployment configuration
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL" || { echo "Missing repository secret: RENDER_DEPLOY_HOOK_URL"; exit 1; }
          test -n "$DIRECT_URL" || { echo "Missing repository secret: DIRECT_URL"; exit 1; }

      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install migration dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:migrate
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}

      - name: Deploy on Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Verify deployed version
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://davidaranda.dev' }}
        run: |
          health_url="${SITE_URL%/}/api/health/ready"
          for attempt in {1..36}; do
            response="$(curl --fail --silent --show-error "$health_url" || true)"
            if printf '%s' "$response" | grep --fixed-strings --quiet "\"version\":\"$GITHUB_SHA\""; then
              exit 0
            fi
            sleep 10
          done
          echo "The deployed version did not become ready in time."
          exit 1
