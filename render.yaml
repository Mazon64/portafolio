services:
  - type: web
    name: portafolio
    runtime: image
    plan: free
    region: oregon
    image:
      url: ghcr.io/mazon64/portafolio:latest
    healthCheckPath: /api/health/live
    domains:
      - davidaranda.dev
    envVars:
      - key: SITE_URL
        value: https://davidaranda.dev
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        sync: false
